name: Build

# This module's source only typechecks in place: it reaches core through ../../core,
# ../../Types and ../../interface. So CI reconstructs that arrangement - check out the Spooder
# host, graft this checkout into src/integration/discord, and run the host's own build.
#
# The host is checked out WITHOUT submodules, so every other integration module is absent.
# That is deliberate: it proves this module depends on core and on no sibling module.

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  HOST_REPO: GreySole/Spooder
  # The host branch this module's 0.5.0-dev is developed against. Move this to 0.5.0-dev
  # once grey/node-events has merged there.
  HOST_REF: grey/node-events
  MODULE_PATH: src/integration/discord

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this module
        uses: actions/checkout@v4
        with:
          path: module

      - name: Check out the Spooder host
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOST_REPO }}
          ref: ${{ env.HOST_REF }}
          path: host

      - name: Graft this checkout into the host tree
        run: |
          rm -rf "host/$MODULE_PATH"
          mkdir -p "host/$MODULE_PATH"
          cp -a module/. "host/$MODULE_PATH/"
          rm -rf "host/$MODULE_PATH/.git"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: host
        run: npm install

      - name: Build
        working-directory: host
        run: npm run build
