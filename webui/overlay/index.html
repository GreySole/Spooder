<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spooder Overlay Container</title>
    <script src="/shared/osc-bundle.js"></script>
    <script src="/overlays/widgets.js"></script>
    <script src="/overlays/container.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #stack {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #stack iframe {
        border: none;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="stack"></div>
  </body>
</html>
